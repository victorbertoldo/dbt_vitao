version: 2

macros:
  - name: exclude_col
    description: >
      Exclude one or more columns from a source relation and return the remaining
      column list with optional table alias.
    arguments:
      - name: schema_nm
        description: Source schema name.
      - name: tab
        description: Table name.
      - name: x_col
        description: Column name to exclude.
      - name: alias
        description: Optional table alias prefix (e.g. 't1').
